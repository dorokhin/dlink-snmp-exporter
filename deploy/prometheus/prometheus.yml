global:
  scrape_interval: 30s

rule_files: []

scrape_configs:
  # One target per switch; the exporter is reached through relabelling.
  - job_name: dlink
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [default]
      auth: [public_v2]
    file_sd_configs:
      # Any *.yml here; copy targets/dlink.yml.example to targets/dlink.yml and list your switches.
      - files: [/etc/prometheus/targets/*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dlink-snmp-exporter:9841

  # MAC address table: changes slowly and adds a series per MAC, so it is scraped less often.
  - job_name: dlink_fdb
    scrape_interval: 1m
    scrape_timeout: 30s
    metrics_path: /probe
    params:
      module: [fdb]
      auth: [public_v2]
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dlink-snmp-exporter:9841

  - job_name: dlink_exporter
    static_configs:
      - targets: [dlink-snmp-exporter:9841]
